<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>صحتي - SEHATI.dz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --danger: #dc2626;
      --accent: #f59e0b;
      --blue: #0284c7;
      --border: #e2e8f0;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }

    body.dark {
      --bg: #0b1120;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #14b8a6;
      --primary-light: #2dd4bf;
      --danger: #ef4444;
      --accent: #fbbf24;
      --blue: #38bdf8;
      --border: #334155;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 90px;
      transition: background 0.3s, color 0.3s;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 55%, #0284c7 100%);
      color: #fff;
      padding: 18px 16px 24px;
      border-radius: 0 0 28px 28px;
      box-shadow: var(--shadow);
    }

    .top {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
    }

    .logo svg {
      width: 26px;
      height: 26px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ecg {
      stroke-dasharray: 180;
      stroke-dashoffset: 1000;
      animation: draw 3.8s linear infinite;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .brand b {
      font-size: 1.35rem;
      font-weight: 800;
      display: block;
      line-height: 1.1;
    }

    .brand small {
      display: block;
      opacity: 0.9;
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .tools {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .seg {
      display: flex;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 11px;
      padding: 3px;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .seg button.on {
      background: #fff;
      color: #0f766e;
    }

    .tool-btn {
      border: 0;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 6px 10px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .portal-btn {
      background: #fff;
      color: #0f766e;
      font-weight: 800;
    }

    .search-wrap input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      background: #fff;
      color: #0f172a;
    }

    .emergency-sec {
      padding: 14px 16px 4px;
    }

    .sec-head {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .emerg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .emerg-card {
      background: var(--danger);
      color: #fff;
      text-decoration: none;
      padding: 8px 4px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.76rem;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(220, 38, 38, 0.25);
    }

    .emerg-card b {
      display: block;
      font-size: 1.02rem;
      margin-top: 2px;
    }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: none;
    }

    .cats::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .promo-box {
      margin: 2px 16px 12px;
      padding: 11px 14px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.14), rgba(15, 118, 110, 0.14));
      border: 1px dashed var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }

    .promo-tag {
      background: var(--accent);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .item-card.featured {
      border: 2px solid var(--accent);
    }

    .badge-feat {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
    }

    html[dir="ltr"] .badge-feat {
      left: auto;
      right: 12px;
    }

    .item-title {
      font-size: 1.08rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .item-sub {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .item-services {
      font-size: 0.82rem;
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dot-open {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-inline-end: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 6px;
    }

    .act-btn {
      text-decoration: none;
      border: none;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .act-book {
      background: var(--blue);
      color: #fff;
    }

    .act-call {
      background: var(--primary);
      color: #fff;
    }

    .act-map {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .act-fav {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
    }

    .act-fav.saved {
      color: #ef4444;
      border-color: #ef4444;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      background: var(--card);
      color: var(--text);
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .close-x {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--muted);
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }

    .btn-primary {
      width: 100%;
      padding: 11px;
      border-radius: 11px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .tabs-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .appt-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 0.86rem;
    }

    .appt-item header {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 700;
      z-index: 300;
      display: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="top">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <polyline class="ecg" points="2 12 6 12 9 4 13 20 16 12 22 12"></polyline>
          </svg>
        </div>
        <div>
          <b>صحتي | SEHATI</b>
          <small id="tagSub">دليلك الصحي وحجز المواعيد في الجزائر</small>
        </div>
      </div>

      <div class="tools">
        <button class="tool-btn portal-btn" onclick="openProPortal()" id="proPortalBtn">🩺 بوابة المهنيين</button>
        <div class="seg">
          <button id="btnAr" class="on" onclick="setLang('ar')">عربي</button>
          <button id="btnFr" onclick="setLang('fr')">FR</button>
        </div>
        <button class="tool-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" oninput="render()" placeholder="ابحث عن طبيب، صيدلية، عيادة، خدمة، أو ولاية..." />
    </div>
  </header>

  <section class="emergency-sec">
    <div class="sec-head">
      <span id="emergLabel">🚨 أرقام الطوارئ (اتصال مباشر)</span>
    </div>
    <div class="emerg-grid">
      <a href="tel:14" class="emerg-card"><span id="e1">الحماية المدنية</span><b>14</b></a>
      <a href="tel:1548" class="emerg-card"><span id="e2">الشرطة</span><b>1548</b></a>
      <a href="tel:1055" class="emerg-card"><span id="e3">الدرك الوطني</span><b>1055</b></a>
      <a href="tel:115" class="emerg-card"><span id="e4">الإسعاف</span><b>115</b></a>
    </div>
  </section>

  <nav class="cats">
    <button class="cat-pill active" onclick="setCat('all', this)" data-k="all">الكل</button>
    <button class="cat-pill" onclick="setCat('fav', this)" data-k="fav">❤️ المفضلة</button>
    <button class="cat-pill" onclick="setCat('d', this)" data-k="d">أطباء</button>
    <button class="cat-pill" onclick="setCat('c', this)" data-k="c">عيادات</button>
    <button class="cat-pill" onclick="setCat('p', this)" data-k="p">صيدليات</button>
    <button class="cat-pill" onclick="setCat('h', this)" data-k="h">مستشفيات</button>
    <button class="cat-pill" onclick="setCat('l', this)" data-k="l">مخابر</button>
    <button class="cat-pill" onclick="setCat('g', this)" data-k="g">أطباء أسنان</button>
    <button class="cat-pill" onclick="setCat('r', this)" data-k="r">أشعة</button>
  </nav>

  <div class="promo-box">
    <div>
      <span class="promo-tag" id="adBadge">للمهنيين</span>
      <div id="adDesc" style="font-weight:700; margin-top:3px;">هل أنت طبيب أو صاحب صيدلية/عيادة؟ سجل مجاناً لاستقبال المواعيد</div>
    </div>
    <button onclick="openProPortal()" id="adLink" style="background:var(--primary); color:#fff; border:none; padding:6px 12px; border-radius:9px; font-weight:800; cursor:pointer; white-space:nowrap;">سجّل الآن</button>
  </div>

  <main class="list" id="listContainer"></main>

  <div class="modal" id="bookModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="bookTitle">📅 حجز موعد طبي</h3>
        <button class="close-x" onclick="closeModal('bookModal')">✕</button>
      </div>
      <p id="bookTargetName" style="font-weight:800; color:var(--primary); margin-bottom:10px;"></p>
      <div class="form-group">
        <label id="lblPatientName">الاسم واللقب *</label>
        <input type="text" id="bFullName" placeholder="مثال: أحمد بن علي" />
      </div>
      <div class="form-group">
        <label id="lblPatientPhone">رقم الهاتف للتأكيد *</label>
        <input type="tel" id="bPhone" placeholder="مثال: 0550123456" />
      </div>
      <div class="form-group">
        <label id="lblApptDate">التاريخ المفضل *</label>
        <input type="date" id="bDate" />
      </div>
      <div class="form-group">
        <label id="lblApptTime">الفترة المناسبة</label>
        <select id="bPeriod">
          <option value="صباحاً (08:30 - 12:00)">صباحاً (08:30 - 12:00)</option>
          <option value="مساءً (13:30 - 17:00)">مساءً (13:30 - 17:00)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="lblApptNote">سبب الزيارة / الخدمة المطلوبة (اختياري)</label>
        <input type="text" id="bNote" placeholder="مثال: كشف عام، تحاليل، استشارة..." />
      </div>
      <button class="btn-primary" onclick="submitAppointment()" id="btnConfirmBook">✅ تأكيد إرسال الموعد</button>
    </div>
  </div>

  <div class="modal" id="proModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="proModalTitle">🩺 بوابة الأطباء والصيدليات والعيادات</h3>
        <button class="close-x" onclick="closeModal('proModal')">✕</button>
      </div>

      <div id="proAuthView">
        <div class="tabs-bar">
          <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">تسجيل الدخول</button>
          <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">تسجيل مؤسسة جديدة</button>
        </div>

        <div id="loginForm">
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="doctor@sehati.dz" />
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="loginPass" placeholder="••••••••" />
          </div>
          <button class="btn-primary" onclick="proLogin()">دخول إلى لوحة التحكم</button>
        </div>

        <div id="registerForm" style="display:none;">
          <div class="form-group">
            <label>نوع المؤسسة *</label>
            <select id="regType">
              <option value="d">طبيب (عيادة خاصة)</option>
              <option value="p">صيدلية</option>
              <option value="c">عيادة متعددة الخدمات</option>
              <option value="l">مخبر تحاليل طبية</option>
              <option value="g">طبيب أسنان</option>
              <option value="r">مركز أشعة</option>
              <option value="h">مستشفى</option>
            </select>
          </div>
          <div class="form-group">
            <label>اسم الطبيب أو الصيدلية أو العيادة *</label>
            <input type="text" id="regName" placeholder="مثال: د. محمد أمين / صيدلية الشفاء" />
          </div>
          <div class="form-group">
            <label>التخصص الدقيق *</label>
            <input type="text" id="regSpec" placeholder="مثال: طب الأطفال، صيدلية مناوبة..." />
          </div>
          <div class="form-group">
            <label>الخدمات المقدمة *</label>
            <textarea id="regServices" rows="2" placeholder="اكتب خدماتك هنا (مثال: فحص بالصدى، تخطيط القلب، قياس الضغط...)"></textarea>
          </div>
          <div class="form-group">
            <label>العنوان والولاية *</label>
            <input type="text" id="regAddr" placeholder="الحي، البلدية، الولاية" />
          </div>
          <div class="form-group">
            <label>أوقات العمل *</label>
            <input type="text" id="regHours" placeholder="مثال: السبت - الخميس (08:30 - 17:00)" />
          </div>
          <div class="form-group">
            <label>رقم الهاتف المهني *</label>
            <input type="tel" id="regPhone" placeholder="0550000000" />
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني للحساب *</label>
            <input type="email" id="regEmail" placeholder="email@domain.com" />
          </div>
          <div class="form-group">
            <label>كلمة المرور (6 أحرف على الأقل) *</label>
            <input type="password" id="regPass" placeholder="••••••••" />
          </div>
          <button class="btn-primary" onclick="proRegister()">إنشاء الحساب ونشر الملف</button>
        </div>
      </div>

      <div id="proDashboardView" style="display:none;">
        <div class="tabs-bar">
          <button class="tab-btn active" id="dashTabAppts" onclick="switchDashTab('appts')">📅 المواعيد الواردة (<span id="apptCount">0</span>)</button>
          <button class="tab-btn" id="dashTabEdit" onclick="switchDashTab('edit')">✏️ تعديل ملفي وخدماتي</button>
        </div>

        <div id="dashApptsPanel">
          <div id="apptsList"></div>
        </div>

        <div id="dashEditPanel" style="display:none;">
          <div class="form-group">
            <label>الاسم</label>
            <input type="text" id="editName" />
          </div>
          <div class="form-group">
            <label>التخصص</label>
            <input type="text" id="editSpec" />
          </div>
          <div class="form-group">
            <label>الخدمات المقدمة (تظهر للمرضى في بطاقتك)</label>
            <textarea id="editServices" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>العنوان</label>
            <input type="text" id="editAddr" />
          </div>
          <div class="form-group">
            <label>أوقات العمل وحالة المناوبة</label>
            <input type="text" id="editHours" />
          </div>
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="editPhone" />
          </div>
          <button class="btn-primary" onclick="saveProProfile()">💾 حفظ التعديلات</button>
        </div>

        <button class="btn-secondary" onclick="proLogout()">🚪 تسجيل الخروج</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, addDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    window.fbReady = false;
    window.fb = {};

    async function setupFirebase() {
      if (firebaseConfig.apiKey === "YOUR_API_KEY") {
        window.render();
        return;
      }
      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        window.fbReady = true;
        window.fb = { db, auth, collection, getDocs, doc, setDoc, updateDoc, addDoc, query, where, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut };

        const snap = await getDocs(collection(db, "health_places"));
        const remote = [];
        snap.forEach(d => remote.push({ id: d.id, ...d.data() }));
        if (remote.length > 0) {
          window.placesData = remote;
        }

        onAuthStateChanged(auth, async (user) => {
          if (user) {
            window.currentProUser = user;
            await window.loadProDashboard(user.uid);
          } else {
            window.currentProUser = null;
          }
        });
      } catch (err) {
        console.error("Firebase init error:", err);
      }
      window.render();
    }

    setupFirebase();
  </script>

    const T = {

        e1: 'الحماية المدنية', e2: 'الشرطة', e3: 'الدرك الوطني', e4: 'الإسعاف',
        all: 'الكل', fav: '❤️ المفضلة', d: 'أطباء', c: 'عيادات', p: 'صيدليات', h: 'مستشفيات', l: 'مخابر', g: 'أطباء أسنان', r: 'أشعة',
        book: '📅 موعد', call: '📞 اتصال', map: '📍 الموقع', feat: '⭐ مميز',
        adBadge: 'للمهنيين', adDesc: 'هل أنت طبيب أو صاحب صيدلية/عيادة؟ سجل مجاناً لاستقبال المواعيد', adLink: 'سجّل الآن',
        empty: 'لا توجد نتائج مطابقة.'

      fr: {
        sub: 'Votre guide santé et prise de RDV en Algérie',

        search: 'Rechercher un médecin, pharmacie, service ou wilaya...',
        emerg: "🚨 Numéros d'urgence (Appel direct)",
        e1: 'Protection Civile', e2: 'Police', e3: 'Gendarmerie', e4: 'SAMU',
        all: 'Tout', fav: '❤️ Favoris', d: 'Médecins', c: 'Cliniques', p: 'Pharmacies', h: 'Hôpitaux', l: 'Labos', g: 'Dentistes', r: 'Imagerie',
        book: '📅 RDV', call: '📞 Appeler', map: '📍 Carte', feat: '⭐ Sponsorisé',
        adBadge: 'Espace Pro', adDesc: 'Médecin, pharmacie ou clinique ? Inscrivez-vous gratuitement', adLink: "S'inscrire",
        empty: 'Aucun résultat trouvé.'
      }
    };

    function showToast(msg) {
      const el = document.getElementById('toastMsg');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 3200);
    }

    function setLang(l) {
      lang = l;
      document.documentElement.lang = l;
      document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('btnAr').classList.toggle('on', l === 'ar');
      document.getElementById('btnFr').classList.toggle('on', l === 'fr');

      const t = T[l];
      document.getElementById('tagSub').textContent = t.sub;
      document.getElementById('proPortalBtn').textContent = t.proBtn;
      document.getElementById('searchInput').placeholder = t.search;
      document.getElementById('emergLabel').textContent = t.emerg;
      document.getElementById('e1').textContent = t.e1;
      document.getElementById('e2').textContent = t.e2;
      document.getElementById('e3').textContent = t.e3;
      document.getElementById('e4').textContent = t.e4;
      document.getElementById('adBadge').textContent = t.adBadge;
      document.getElementById('adDesc').textContent = t.adDesc;
      document.getElementById('adLink').textContent = t.adLink;

      document.querySelectorAll('[data-k]').forEach(el => {
        el.textContent = t[el.getAttribute('data-k')];
      });
      render();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      document.getElementById('themeBtn').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }

    function setCat(c, btn) {
      currentCat = c;
      document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function toggleFav(id) {
      favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
      localStorage.setItem('sehati_favs', JSON.stringify(favs));
      render();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function openBooking(placeId) {
      const place = window.placesData.find(p => p.id === placeId);
      if (!place) return;
      selectedPlaceForBooking = place;
      const name = lang === 'ar' ? place.nm_ar : place.nm_fr;
      document.getElementById('bookTargetName').textContent = '📍 ' + name;
      document.getElementById('bDate').valueAsDate = new Date();
      document.getElementById('bookModal').classList.add('open');
    }

    async function submitAppointment() {
      const fullName = document.getElementById('bFullName').value.trim();
      const phone = document.getElementById('bPhone').value.trim();
      const date = document.getElementById('bDate').value;
      const period = document.getElementById('bPeriod').value;
      const note = document.getElementById('bNote').value.trim();

      if (!fullName || !phone || !date) {
        showToast(lang === 'ar' ? 'يرجى إدخال الاسم واللقب ورقم الهاتف والتاريخ' : 'Veuillez remplir les champs obligatoires');
        return;
      }

      const appt = {
        id: 'appt_' + Date.now(),
        placeId: selectedPlaceForBooking.id,
        placeName: selectedPlaceForBooking.nm_ar,
        patientName: fullName,
        patientPhone: phone,
        date,
        period,
        note: note || 'كشف / استشارة',
        createdAt: new Date().toISOString()
      };

      localAppointments.unshift(appt);
      localStorage.setItem('sehati_appointments', JSON.stringify(localAppointments));

      if (window.fbReady) {
        try {
          await window.fb.addDoc(window.fb.collection(window.fb.db, "appointments"), appt);
        } catch (e) { console.error(e); }
      }

      document.getElementById('bFullName').value = '';
      document.getElementById('bPhone').value = '';
      document.getElementById('bNote').value = '';
      closeModal('bookModal');
      showToast(lang === 'ar' ? '✅ تم إرسال طلب الموعد بنجاح! سيتصل بك الطبيب للتأكيد.' : '✅ Rendez-vous envoyé avec succès !');
    }

    function openProPortal() {
      document.getElementById('proModal').classList.add('open');
      if (window.currentProUser || localProSession) {
        showProDashboard();
      } else {
        document.getElementById('proAuthView').style.display = 'block';
        document.getElementById('proDashboardView').style.display = 'none';
      }
    }

    function switchAuthTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    function switchDashTab(tab) {
      document.getElementById('dashTabAppts').classList.toggle('active', tab === 'appts');
      document.getElementById('dashTabEdit').classList.toggle('active', tab === 'edit');
      document.getElementById('dashApptsPanel').style.display = tab === 'appts' ? 'block' : 'none';
      document.getElementById('dashEditPanel').style.display = tab === 'edit' ? 'block' : 'none';
    }

    async function proRegister() {
      const tp = document.getElementById('regType').value;
      const nm = document.getElementById('regName').value.trim();
      const sp = document.getElementById('regSpec').value.trim();
      const srv = document.getElementById('regServices').value.trim();
      const ad = document.getElementById('regAddr').value.trim();
      const hr = document.getElementById('regHours').value.trim();
      const ph = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPass').value.trim();

      if (!nm || !sp || !ph || !email || pass.length < 6) {
        showToast('يرجى ملء جميع الحقول وكلمة مرور من 6 أحرف على الأقل');
        return;
      }

      let uid = 'pro_' + Date.now();
      if (window.fbReady) {
        try {
          const cred = await window.fb.createUserWithEmailAndPassword(window.fb.auth, email, pass);
          uid = cred.user.uid;
        } catch (err) {
          showToast('خطأ في التسجيل: ' + err.message);
          return;
        }
      }

      const profileData = {
        id: uid,
        ownerUid: uid,
        email,
        pass,
        tp,
        nm_ar: nm, nm_fr: nm,
        sp_ar: sp, sp_fr: sp,
        srv_ar: srv || 'خدمات طبية وصحية', srv_fr: srv || 'Services médicaux',
        ad_ar: ad || 'الجزائر', ad_fr: ad || 'Algérie',
        hr_ar: hr || '08:30 - 17:00', hr_fr: hr || '08h30 - 17h00',
        ph,
        feat: false,
        canBook: tp !== 'p' && tp !== 'h'
      };

      localPlaces.push(profileData);
      localStorage.setItem('sehati_pro_places', JSON.stringify(localPlaces));
      window.placesData.push(profileData);

      localProSession = profileData;
      localStorage.setItem('sehati_pro_session', JSON.stringify(profileData));
      currentProProfile = profileData;

      if (window.fbReady) {
        await window.fb.setDoc(window.fb.doc(window.fb.db, "health_places", uid), profileData);
      }

      render();
      showProDashboard();
      showToast('✅ تم إنشاء حسابك ونشر بطاقتك بنجاح!');
    }

    async function proLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if (!email || !pass) return;

      if (window.fbReady) {
        try {
          const cred = await window.fb.signInWithEmailAndPassword(window.fb.auth, email, pass);
          await window.loadProDashboard(cred.user.uid);
          showProDashboard();
          return;
        } catch (err) {
          showToast('بيانات الدخول غير صحيحة');
          return;
        }
      }

      const found = localPlaces.find(p => p.email === email && p.pass === pass);
      if (found) {
        localProSession = found;
        localStorage.setItem('sehati_pro_session', JSON.stringify(found));
        currentProProfile = found;
        showProDashboard();
      } else {
        showToast('الحساب غير موجود، يمكنك إنشاء حساب مهني جديد');
      }
    }

    window.loadProDashboard = async function(uid) {
      const found = window.placesData.find(p => p.id === uid || p.ownerUid === uid);
      if (found) {
        currentProProfile = found;
        localProSession = found;
      }
    };

    async function showProDashboard() {
      document.getElementById('proAuthView').style.display = 'none';
      document.getElementById('proDashboardView').style.display = 'block';

      const prof = currentProProfile || localProSession;
      if (!prof) return;

      document.getElementById('editName').value = prof.nm_ar || '';
      document.getElementById('editSpec').value = prof.sp_ar || '';
      document.getElementById('editServices').value = prof.srv_ar || '';
      document.getElementById('editAddr').value = prof.ad_ar || '';
      document.getElementById('editHours').value = prof.hr_ar || '';
      document.getElementById('editPhone').value = prof.ph || '';

      let myAppts = localAppointments.filter(a => a.placeId === prof.id);
      if (window.fbReady) {
        try {
          const q = window.fb.query(window.fb.collection(window.fb.db, "appointments"), window.fb.where("placeId", "==", prof.id));
          const snap = await window.fb.getDocs(q);
          myAppts = [];
          snap.forEach(d => myAppts.push({ id: d.id, ...d.data() }));
        } catch (e) { console.error(e); }
      }

      document.getElementById('apptCount').textContent = myAppts.length;
      const listEl = document.getElementById('apptsList');
      if (myAppts.length === 0) {
        listEl.innerHTML = '<p style="text-align:center; color:var(--muted); padding:20px;">لا توجد مواعيد محجوزة حتى الآن.</p>';
      } else {
        listEl.innerHTML = myAppts.map(a => `
          <div class="appt-item">
            <header>
              <span>👤 ${a.patientName}</span>
              <span style="color:var(--primary);">${a.date}</span>
            </header>
            <div>🕒 ${a.period} | 📝 ${a.note}</div>
            <div style="margin-top:6px;">
              <a href="tel:${a.patientPhone}" style="display:inline-block; background:var(--primary); color:#fff; padding:4px 10px; border-radius:8px; text-decoration:none; font-weight:700;">📞 اتصال بالمريض: ${a.patientPhone}</a>
            </div>
          </div>
        `).join('');
      }
    }

    async function saveProProfile() {
      const prof = currentProProfile || localProSession;
      if (!prof) return;

      prof.nm_ar = prof.nm_fr = document.getElementById('editName').value.trim();
      prof.sp_ar = prof.sp_fr = document.getElementById('editSpec').value.trim();
      prof.srv_ar = prof.srv_fr = document.getElementById('editServices').value.trim();
      prof.ad_ar = prof.ad_fr = document.getElementById('editAddr').value.trim();
      prof.hr_ar = prof.hr_fr = document.getElementById('editHours').value.trim();
      prof.ph = document.getElementById('editPhone').value.trim();

      localPlaces = localPlaces.map(p => p.id === prof.id ? prof : p);
      localStorage.setItem('sehati_pro_places', JSON.stringify(localPlaces));
      localStorage.setItem('sehati_pro_session', JSON.stringify(prof));
      window.placesData = window.placesData.map(p => p.id === prof.id ? prof : p);

      if (window.fbReady) {
        try {
          await window.fb.updateDoc(window.fb.doc(window.fb.db, "health_places", prof.id), {
            nm_ar: prof.nm_ar, nm_fr: prof.nm_fr,
            sp_ar: prof.sp_ar, sp_fr: prof.sp_fr,
            srv_ar: prof.srv_ar, srv_fr: prof.srv_fr,
            ad_ar: prof.ad_ar, ad_fr: prof.ad_fr,
            hr_ar: prof.hr_ar, hr_fr: prof.hr_fr,
            ph: prof.ph
          });
        } catch (e) { console.error(e); }
      }

      render();
      showToast('✅ تم حفظ وتحديث معلوماتك وخدماتك بنجاح!');
    }

    async function proLogout() {
      if (window.fbReady) {
        await window.fb.signOut(window.fb.auth);
      }
      localProSession = null;
      currentProProfile = null;
      localStorage.removeItem('sehati_pro_session');
      closeModal('proModal');
      showToast('تم تسجيل الخروج');
    }

    window.render = function() {
      const box = document.getElementById('listContainer');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const t = T[lang];

      const sorted = [...window.placesData].sort((a, b) => (b.feat === true) - (a.feat === true));

      const filtered = sorted.filter(item => {
        if (currentCat === 'fav' && !favs.includes(item.id)) return false;
        if (currentCat !== 'all' && currentCat !== 'fav' && item.tp !== currentCat) return false;
        const hay = `${item.nm_ar} ${item.nm_fr} ${item.sp_ar} ${item.sp_fr} ${item.srv_ar || ''} ${item.ad_ar} ${item.ad_fr}`.toLowerCase();
        return !q || hay.includes(q);
      });

      if (!filtered.length) {
        box.innerHTML = `<p style="text-align:center;color:var(--muted);padding:30px;">${t.empty}</p>`;
        return;
      }

      box.innerHTML = filtered.map(item => {
        const name = lang === 'ar' ? item.nm_ar : item.nm_fr;
        const spec = lang === 'ar' ? item.sp_ar : item.sp_fr;
        const srv = lang === 'ar' ? (item.srv_ar || '') : (item.srv_fr || '');
        const addr = lang === 'ar' ? item.ad_ar : item.ad_fr;
        const hours = lang === 'ar' ? item.hr_ar : item.hr_fr;
        const isFav = favs.includes(item.id);
        const allowBook = item.canBook !== false && item.tp !== 'p';
        const mapLink = item.lat && item.lng
          ? `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`
          : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' ' + addr)}`;

        return `
          <div class="item-card ${item.feat ? 'featured' : ''}">
            ${item.feat ? `<span class="badge-feat">${t.feat}</span>` : ''}
            <div class="item-title">${name}</div>
            <div class="item-sub">${spec}</div>
            ${srv ? `<div class="item-services">🩺 ${srv}</div>` : ''}
            <div class="item-meta">
              <span>📍 ${addr}</span>
              <span><i class="dot-open"></i>🕒 ${hours}</span>
            </div>
            <div class="actions" style="grid-template-columns: ${allowBook ? '1fr 1fr 1fr auto' : '1fr 1fr auto'};">
              ${allowBook ? `<button onclick="openBooking('${item.id}')" class="act-btn act-book">${t.book}</button>` : ''}
              <a href="tel:${item.ph}" class="act-btn act-call">${t.call}</a>
              <a href="${mapLink}" target="_blank" class="act-btn act-map">${t.map}</a>
              <button onclick="toggleFav('${item.id}')" class="act-btn act-fav ${isFav ? 'saved' : ''}">${isFav ? '❤️' : '🤍'}</button>
            </div>
          </div>
        `;
      }).join('');
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    render();
  </script>
