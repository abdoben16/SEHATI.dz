<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>صحتي - SEHATI.dz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-light: #14b8a6;
      --danger: #dc2626;
      --accent: #f59e0b;
      --blue: #0284c7;
      --border: #e2e8f0;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    }

    body.dark {
      --bg: #0b1120;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #14b8a6;
      --primary-light: #2dd4bf;
      --danger: #ef4444;
      --accent: #fbbf24;
      --blue: #38bdf8;
      --border: #334155;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 90px;
      transition: background 0.3s, color 0.3s;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 55%, #0284c7 100%);
      color: #fff;
      padding: 18px 16px 24px;
      border-radius: 0 0 28px 28px;
      box-shadow: var(--shadow);
    }

    .top {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      backdrop-filter: blur(6px);
    }

    .logo svg {
      width: 26px;
      height: 26px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ecg {
      stroke-dasharray: 180;
      stroke-dashoffset: 1000;
      animation: draw 3.8s linear infinite;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    .brand b {
      font-size: 1.35rem;
      font-weight: 800;
      display: block;
      line-height: 1.1;
    }

    .brand small {
      display: block;
      opacity: 0.9;
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .tools {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .seg {
      display: flex;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 11px;
      padding: 3px;
    }

    .seg button {
      border: 0;
      background: transparent;
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .seg button.on {
      background: #fff;
      color: #0f766e;
    }

    .tool-btn {
      border: 0;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      padding: 6px 10px;
      border-radius: 11px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .portal-btn {
      background: #fff;
      color: #0f766e;
      font-weight: 800;
    }

    .search-wrap input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      background: #fff;
      color: #0f172a;
    }

    .emergency-sec {
      padding: 14px 16px 4px;
    }

    .sec-head {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .emerg-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .emerg-card {
      background: var(--danger);
      color: #fff;
      text-decoration: none;
      padding: 8px 4px;
      border-radius: 12px;
      text-align: center;
      font-size: 0.76rem;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(220, 38, 38, 0.25);
    }

    .emerg-card b {
      display: block;
      font-size: 1.02rem;
      margin-top: 2px;
    }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: none;
    }

    .cats::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .promo-box {
      margin: 2px 16px 12px;
      padding: 11px 14px;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.14), rgba(15, 118, 110, 0.14));
      border: 1px dashed var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }

    .promo-tag {
      background: var(--accent);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
      position: relative;
    }

    .item-card.featured {
      border: 2px solid var(--accent);
    }

    .badge-feat {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: #000;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
    }

    html[dir="ltr"] .badge-feat {
      left: auto;
      right: 12px;
    }

    .item-title {
      font-size: 1.08rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .item-sub {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .item-services {
      font-size: 0.82rem;
      background: var(--bg);
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .item-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dot-open {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-inline-end: 6px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 6px;
    }

    .act-btn {
      text-decoration: none;
      border: none;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .act-book {
      background: var(--blue);
      color: #fff;
    }

    .act-call {
      background: var(--primary);
      color: #fff;
    }

    .act-map {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .act-fav {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 10px;
    }

    .act-fav.saved {
      color: #ef4444;
      border-color: #ef4444;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      background: var(--card);
      color: var(--text);
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .close-x {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--muted);
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 3px;
      color: var(--muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
    }

    .btn-primary {
      width: 100%;
      padding: 11px;
      border-radius: 11px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-secondary {
      width: 100%;
      padding: 10px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
    }

    .tabs-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .appt-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 0.86rem;
    }

    .appt-item header {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 700;
      z-index: 300;
      display: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="top">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <polyline class="ecg" points="2 12 6 12 9 4 13 20 16 12 22 12"></polyline>
          </svg>
        </div>
        <div>
          <b>صحتي | SEHATI</b>
          <small id="tagSub">دليلك الصحي وحجز المواعيد في الجزائر</small>
        </div>
      </div>

      <div class="tools">
        <button class="tool-btn portal-btn" onclick="openProPortal()" id="proPortalBtn">🩺 بوابة المهنيين</button>
        <div class="seg">
          <button id="btnAr" class="on" onclick="setLang('ar')">عربي</button>
          <button id="btnFr" onclick="setLang('fr')">FR</button>
        </div>
        <button class="tool-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
      </div>
    </div>

    <div class="search-wrap">
      <input type="text" id="searchInput" oninput="render()" placeholder="ابحث عن طبيب، صيدلية، عيادة، خدمة، أو ولاية..." />
    </div>
  </header>

  <section class="emergency-sec">
    <div class="sec-head">
      <span id="emergLabel">🚨 أرقام الطوارئ (اتصال مباشر)</span>
      <span id="totalCounter" style="color:var(--primary);"></span>
    </div>
    <div class="emerg-grid">
      <a href="tel:14" class="emerg-card"><span id="e1">الحماية المدنية</span><b>14</b></a>
      <a href="tel:1548" class="emerg-card"><span id="e2">الشرطة</span><b>1548</b></a>
      <a href="tel:1055" class="emerg-card"><span id="e3">الدرك الوطني</span><b>1055</b></a>
      <a href="tel:115" class="emerg-card"><span id="e4">الإسعاف</span><b>115</b></a>
    </div>
  </section>

  <nav class="cats">
    <button class="cat-pill active" onclick="setCat('all', this)" data-k="all">الكل</button>
    <button class="cat-pill" onclick="setCat('fav', this)" data-k="fav">❤️ المفضلة</button>
    <button class="cat-pill" onclick="setCat('d', this)" data-k="d">أطباء</button>
    <button class="cat-pill" onclick="setCat('c', this)" data-k="c">عيادات</button>
    <button class="cat-pill" onclick="setCat('p', this)" data-k="p">صيدليات</button>
    <button class="cat-pill" onclick="setCat('h', this)" data-k="h">مستشفيات</button>
    <button class="cat-pill" onclick="setCat('l', this)" data-k="l">مخابر</button>
    <button class="cat-pill" onclick="setCat('g', this)" data-k="g">أطباء أسنان</button>
    <button class="cat-pill" onclick="setCat('r', this)" data-k="r">أشعة</button>
  </nav>

  <div class="promo-box">
    <div>
      <span class="promo-tag" id="adBadge">للمهنيين</span>
      <div id="adDesc" style="font-weight:700; margin-top:3px;">هل أنت طبيب أو صاحب صيدلية/عيادة؟ سجل مجاناً لاستقبال المواعيد</div>
    </div>
    <button onclick="openProPortal()" id="adLink" style="background:var(--primary); color:#fff; border:none; padding:6px 12px; border-radius:9px; font-weight:800; cursor:pointer; white-space:nowrap;">سجّل الآن</button>
  </div>

  <main class="list" id="listContainer"></main>

  <!-- نافذة حجز موعد للمستخدم -->
  <div class="modal" id="bookModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="bookTitle">📅 حجز موعد طبي</h3>
        <button class="close-x" onclick="closeModal('bookModal')">✕</button>
      </div>
      <p id="bookTargetName" style="font-weight:800; color:var(--primary); margin-bottom:10px;"></p>
      <div class="form-group">
        <label id="lblPatientName">الاسم واللقب *</label>
        <input type="text" id="bFullName" placeholder="مثال: أحمد بن علي" />
      </div>
      <div class="form-group">
        <label id="lblPatientPhone">رقم الهاتف للتأكيد *</label>
        <input type="tel" id="bPhone" placeholder="مثال: 0550123456" />
      </div>
      <div class="form-group">
        <label id="lblApptDate">التاريخ المفضل *</label>
        <input type="date" id="bDate" />
      </div>
      <div class="form-group">
        <label id="lblApptTime">الفترة المناسبة</label>
        <select id="bPeriod">
          <option value="صباحاً (08:30 - 12:00)">صباحاً (08:30 - 12:00)</option>
          <option value="مساءً (13:30 - 17:00)">مساءً (13:30 - 17:00)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="lblApptNote">سبب الزيارة / الخدمة المطلوبة (اختياري)</label>
        <input type="text" id="bNote" placeholder="مثال: كشف عام، تحاليل، استشارة..." />
      </div>
      <button class="btn-primary" onclick="submitAppointment()" id="btnConfirmBook">✅ تأكيد إرسال الموعد</button>
    </div>
  </div>

  <!-- بوابة المهنيين + أداة استيراد قاعدة البيانات للمدير -->
  <div class="modal" id="proModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="proModalTitle">🩺 بوابة المهنيين وإدارة البيانات</h3>
        <button class="close-x" onclick="closeModal('proModal')">✕</button>
      </div>

      <div id="proAuthView">
        <div class="tabs-bar">
          <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">تسجيل الدخول</button>
          <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">تسجيل مؤسسة</button>
          <button class="tab-btn" id="tabImport" onclick="switchAuthTab('import')">📥 استيراد بيانات</button>
        </div>

        <div id="loginForm">
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="doctor@sehati.dz" />
          </div>
          <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="loginPass" placeholder="••••••••" />
          </div>
          <button class="btn-primary" onclick="proLogin()">دخول إلى لوحة التحكم</button>
        </div>

        <div id="registerForm" style="display:none;">
          <div class="form-group">
            <label>نوع المؤسسة *</label>
            <select id="regType">
              <option value="d">طبيب (عيادة خاصة)</option>
              <option value="p">صيدلية</option>
              <option value="c">عيادة متعددة الخدمات</option>
              <option value="l">مخبر تحاليل طبية</option>
              <option value="g">طبيب أسنان</option>
              <option value="r">مركز أشعة</option>
              <option value="h">مستشفى</option>
            </select>
          </div>
          <div class="form-group">
            <label>اسم الطبيب أو الصيدلية أو العيادة *</label>
            <input type="text" id="regName" placeholder="مثال: د. محمد أمين / صيدلية الشفاء" />
          </div>
          <div class="form-group">
            <label>التخصص الدقيق *</label>
            <input type="text" id="regSpec" placeholder="مثال: طب الأطفال، صيدلية مناوبة..." />
          </div>
          <div class="form-group">
            <label>الخدمات المقدمة *</label>
            <textarea id="regServices" rows="2" placeholder="اكتب خدماتك هنا..."></textarea>
          </div>
          <div class="form-group">
