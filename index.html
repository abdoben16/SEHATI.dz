<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صحتي | SEHATI - دليل الخدمات الصحية والطوارئ</title>
  <style>
    :root {
      --bg-main: #061311;
      --bg-card: #0d231f;
      --bg-soft: #12302b;
      --accent: #00bfa5;
      --accent-bright: #1de9b6;
      --text-main: #ffffff;
      --text-muted: #b2dfdb;
      --border: rgba(29, 233, 182, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #05110f 0%, #091d19 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 36px;
    }

    .app-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 12px;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-bright);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* أرقام الطوارئ المصغرة بألوان البدلة الرسمية */
    .emergency-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 12px;
    }

    .emergency-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding-right: 2px;
    }

    .emergency-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .em-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #ffffff;
      border-radius: 9px;
      padding: 6px 4px;
      min-height: 44px;
      font-size: 10.5px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .em-num {
      font-size: 12.5px;
      font-weight: 900;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    /* ألوان البدلة الرسمية لكل جهة */
    .em-civil {
      background: linear-gradient(135deg, #1b2838, #e65100);
      border-color: #ff9800;
    }

    .em-police {
      background: linear-gradient(135deg, #0b1f3a, #1565c0);
      border-color: #64b5f6;
    }

    .em-gendarmerie {
      background: linear-gradient(135deg, #152617, #2e5233);
      border-color: #81c784;
    }

    .em-ambulance {
      background: linear-gradient(135deg, #2b0d12, #c62828);
      border-color: #ef9a9a;
    }

    /* مساحة الإعلانات الواسعة والصورة الواضحة غير المظللة */
    .ad-container {
      margin: 12px 0;
    }

    .ad-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(29, 233, 182, 0.4);
      background: #0b201c;
      min-height: 250px;
    }

    .ad-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #071613;
    }

    .ad-badge {
      background: #e53935;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
    }

    .sehati-ads-trigger {
      color: #80cbc4;
      font-size: 11px;
      font-weight: 800;
      user-select: none;
      cursor: pointer;
      padding: 2px 6px;
    }

    .ad-img-wrap {
      width: 100%;
      background: #061210;
    }

    .ad-img {
      display: block;
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      opacity: 1;
      filter: none;
    }

    .ad-body {
      padding: 12px 14px;
      background: #0d2621;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ad-title {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .ad-desc {
      font-size: 12px;
      color: #d0ece7;
      line-height: 1.4;
    }

    .ad-cta {
      background: var(--accent);
      color: #041411;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 800;
      padding: 8px 14px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* البحث والفئات */
    .search-box {
      margin: 10px 0;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
    }

    .cats-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    .cat-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #051613;
      border-color: var(--accent);
    }

    /* بطاقات الدليل الصحي */
    .places-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .place-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
    }

    .place-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .place-name {
      font-size: 14.5px;
      font-weight: 800;
      color: #ffffff;
    }

    .place-cat {
      font-size: 11px;
      background: var(--bg-soft);
      color: var(--accent-bright);
      padding: 2px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .place-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.45;
    }

    .place-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .act-btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: #ffffff;
      cursor: pointer;
    }

    .act-call {
      background: var(--accent);
      color: #051613;
      border-color: var(--accent);
    }

    /* نافذة إدارة الإعلانات */
    .ad-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2147483647;
      padding: 14px;
      overflow-y: auto;
    }

    .ad-modal-box {
      max-width: 470px;
      margin: 20px auto;
      background: #0f2420;
      color: #ffffff;
      border: 1px solid var(--accent-bright);
      border-radius: 16px;
      padding: 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-close {
      background: #c62828;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .field-lbl {
      display: block;
      font-size: 12px;
      color: #d0ece7;
      margin-bottom: 8px;
    }

    .field-in, .field-ta {
      width: 100%;
      margin-top: 4px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2f544d;
      background: #081512;
      color: #ffffff;
      font-size: 12.5px;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dur-box {
      background: #081714;
      border: 1px solid #21453e;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .dur-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .mini-btn {
      background: #1a3731;
      color: #ffffff;
      border: 1px solid #3c6e64;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-dur-btn {
      margin-right: auto;
      background: #00897b;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-ad-btn {
      width: 100%;
      background: var(--accent);
      color: #051613;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 12px;
      color: #ffd54f;
      min-height: 18px;
    }

    .ads-manage-list {
      margin-top: 10px;
      border-top: 1px solid #21453e;
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      background: #081613;
      border: 1px solid #1e423b;
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 12px;
    }

    .del-btn {
      background: #c62828;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <!-- الشريط العلوي -->
    <header class="top-header">
      <div>
        <div class="brand-title">صحتي | SEHATI</div>
        <div class="brand-sub">دليل الأطباء، العيادات، الصيدليات والمستشفيات</div>
      </div>
      <span class="sehati-ads-trigger" title="اضغط مطولاً لإدارة الإعلانات">SEHATI ADS</span>
    </header>

    <!-- أرقام الطوارئ المصغرة بألوان البدلة الرسمية -->
    <section class="emergency-section">
      <div class="emergency-title">أرقام الطوارئ</div>
      <div class="emergency-grid">
        <a class="em-btn em-civil" href="tel:14">
          <span>الحماية المدنية</span>
          <span class="em-num">14</span>
        </a>
        <a class="em-btn em-police" href="tel:1548">
          <span>الشرطة</span>
          <span class="em-num">1548</span>
        </a>
        <a class="em-btn em-gendarmerie" href="tel:1055">
          <span>الدرك الوطني</span>
          <span class="em-num">1055</span>
        </a>
        <a class="em-btn em-ambulance" href="tel:115">
          <span>الإسعاف</span>
          <span class="em-num">115</span>
        </a>
      </div>
    </section>

    <!-- مساحة عرض الإعلانات المتعددة -->
    <section id="sehatiAdBox" class="ad-container"></section>

    <!-- البحث -->
    <div class="search-box">
      <input id="searchInput" class="search-input" type="search" placeholder="ابحث عن طبيب، عيادة، صيدلية أو مستشفى...">
    </div>

    <!-- الفئات -->
    <div id="catsBar" class="cats-bar">
      <button class="cat-btn active" data-cat="الكل" type="button">الكل</button>
      <button class="cat-btn" data-cat="المفضلة" type="button">❤️ المفضلة</button>
      <button class="cat-btn" data-cat="أطباء" type="button">أطباء</button>
      <button class="cat-btn" data-cat="عيادات" type="button">عيادات</button>
      <button class="cat-btn" data-cat="صيدليات" type="button">صيدليات</button>
      <button class="cat-btn" data-cat="مستشفيات" type="button">مستشفيات</button>
    </div>

    <!-- قائمة المؤسسات الصحية -->
    <main id="placesList" class="places-list"></main>
  </div>

  <!-- نافذة إدارة الإعلانات -->
  <div id="sehatiAdModal" class="ad-modal">
    <div class="ad-modal-box">
      <div class="modal-head">
        <strong style="color: var(--accent-bright); font-size: 15px;">إدارة إعلانات صحتي</strong>
        <button id="closeAdModalBtn" class="modal-close" type="button">✕</button>
      </div>

      <div class="dur-box">
        <div style="font-size: 12px; font-weight: 700; color: #80cbc4;">مدة عرض الإعلان (بالثواني):</div>
        <div class="dur-controls">
          <button id="minusDurBtn" class="mini-btn" type="button">-1 ث</button>
          <input id="globalDurInput" type="number" min="1" max="120" value="5" style="width: 64px; padding: 5px; border-radius: 7px; border: 1px solid #37474f; background: #061311; color: #fff; text-align: center; font-weight: 700;">
          <span style="font-size: 12px;">ثانية</span>
          <button id="plusDurBtn" class="mini-btn" type="button">+1 ث</button>
          <button id="saveDurBtn" class="save-dur-btn" type="button">حفظ المدة</button>
        </div>
      </div>

      <label class="field-lbl">
        رمز GitHub Token (يُحفظ محلياً على هاتفك):
        <input id="ghTokenInput" class="field-in" type="password" placeholder="ghp_xxxxxxxxxxxx">
      </label>

      <label class="field-lbl">
        صورة الإعلان من الهاتف (تظهر واضحة غير مظللة):
        <input id="adFileInput" class="field-in" type="file" accept="image/*">
      </label>

      <label class="field-lbl">
        عنوان الإعلان:
        <input id="adTitleInput" class="field-in" type="text" placeholder="مثال: عيادة الشفاء - طب عام">
      </label>

      <label class="field-lbl">
        الوصف / التخصص / العنوان:
        <textarea id="adDescInput" class="field-ta" rows="2" placeholder="مثال: وسط المدينة - استشارات وتحاليل"></textarea>
      </label>

      <div class="row-2">
        <label class="field-lbl">
          نص الزر:
          <input id="adBtnTextInput" class="field-in" type="text" value="اتصل الآن">
        </label>
        <label class="field-lbl">
          الرابط أو الهاتف:
          <input id="adBtnLinkInput" class="field-in" type="text" placeholder="tel:0550000000">
        </label>
      </div>

      <label class="field-lbl">
        مدة خاصة لهذا الإعلان (ثواني - اختياري):
        <input id="adItemDurInput" class="field-in" type="number" min="1" max="120" placeholder="اتركه فارغاً لاستخدام المدة العامة">
      </label>

      <button id="addAdBtn" class="add-ad-btn" type="button">إضافة ونشر الإعلان</button>
      <div id="adStatusMsg" class="status-msg"></div>

      <div class="ads-manage-list">
        <div style="font-size: 12px; font-weight: 700; color: #80cbc4;">الإعلانات المنشورة:</div>
        <div id="adsManageItems"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const OWNER = "abdoben16";
      const REPO = "SEHATI.dz";
      const BRANCH = "main";
      const AD_JSON_PATH = "ad.json";
      const TOKEN_STORAGE_KEY = "sehatiAdSys_gh_token";
      const FAV_STORAGE_KEY = "sehati_favs_v1";

      const SAMPLE_PLACES = [
        {
          id: "p1",
          name: "المستشفى الجامعي فرانسوا فانون",
          cat: "مستشفيات",
          info: "استعجالات طبية وجراحية • 24/7",
          phone: "024212121",
          map: "https://maps.google.com/?q=Blida+Hospital"
        },
        {
          id: "p2",
          name: "عيادة الأمل الطبية",
          cat: "عيادات",
          info: "طب عام، طب الأطفال، تحاليل طبية • 08:00 - 20:00",
          phone: "0550112233",
          map: "https://maps.google.com/?q=Medical+Clinic"
        },
        {
          id: "p3",
          name: "د. كريم منصور - أمراض القلب",
          cat: "أطباء",
          info: "استشارات أمراض القلب وتخطيط القلب • مواعيد يومية",
          phone: "0661445566",
          map: "https://maps.google.com/?q=Cardiologist"
        },
        {
          id: "p4",
          name: "صيدلية النور",
          cat: "صيدليات",
          info: "أدوية عامة ومستلزمات طبية • مناوبة متوفرة",
          phone: "0770998877",
          map: "https://maps.google.com/?q=Pharmacy"
        }
      ];

      // بيانات الدليل الصحي
      const placesListEl = document.getElementById("placesList");
      const searchInputEl = document.getElementById("searchInput");
      const catsBarEl = document.getElementById("catsBar");
      let activeCat = "الكل";
      let favIds = JSON.parse(localStorage.getItem(FAV_STORAGE_KEY) || "[]");

      function saveFavs() {
        localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(favIds));
      }

      function renderPlaces() {
        const q = (searchInputEl.value || "").trim().toLowerCase();
        const filtered = SAMPLE_PLACES.filter((p) => {
          if (activeCat === "المفضلة" && favIds.indexOf(p.id) === -1) return false;
          if (activeCat !== "الكل" && activeCat !== "المفضلة" && p.cat !== activeCat) return false;
          if (!q) return true;
          return (p.name + " " + p.cat + " " + p.info).toLowerCase().indexOf(q) !== -1;
        });

        if (!filtered.length) {
          placesListEl.innerHTML = '<div class="place-card" style="text-align:center;color:#b2dfdb;">لا توجد نتائج مطابقة.</div>';
          return;
        }

        placesListEl.innerHTML = filtered.map((p) => {
          const isFav = favIds.indexOf(p.id) !== -1;
          return `
            <article class="place-card">
              <div class="place-top">
                <div class="place-name">${p.name}</div>
                <span class="place-cat">${p.cat}</span>
              </div>
              <div class="place-info">${p.info}</div>
              <div class="place-actions">
                <a class="act-btn act-call" href="tel:${p.phone}">اتصال</a>
                <a class="act-btn" href="${p.map}" target="_blank" rel="noopener">الموقع</a>
                <button class="act-btn fav-btn" data-id="${p.id}" type="button">${isFav ? "❤️ محفوظ" : "🤍 حفظ"}</button>
              </div>
            </article>
          `;
        }).join("");

        placesListEl.querySelectorAll(".fav-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            const idx = favIds.indexOf(id);
            if (idx === -1) favIds.push(id);
            else favIds.splice(idx, 1);
            saveFavs();
            renderPlaces();
          });
        });
      }

      searchInputEl.addEventListener("input", renderPlaces);
      catsBarEl.querySelectorAll(".cat-btn").forEach((b) => {
        b.addEventListener("click", () => {
          catsBarEl.querySelectorAll(".cat-btn").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          activeCat = b.getAttribute("data-cat");
          renderPlaces();
        });
      });

      // نظام الإعلانات المتعددة
      const adBoxEl = document.getElementById("sehatiAdBox");
      const adModalEl = document.getElementById("sehatiAdModal");
      const closeAdModalBtn = document.getElementById("closeAdModalBtn");
      const minusDurBtn = document.getElementById("minusDurBtn");
      const plusDurBtn = document.getElementById("plusDurBtn");
      const globalDurInput = document.getElementById("globalDurInput");
      const saveDurBtn = document.getElementById("saveDurBtn");
      const ghTokenInput = document.getElementById("ghTokenInput");
      const adFileInput = document.getElementById("adFileInput");
      const adTitleInput = document.getElementById("adTitleInput");
      const adDescInput = document.getElementById("adDescInput");
      const adBtnTextInput = document.getElementById("adBtnTextInput");
      const adBtnLinkInput = document.getElementById("adBtnLinkInput");
      const adItemDurInput = document.getElementById("adItemDurInput");
      const addAdBtn = document.getElementById("addAdBtn");
      const adStatusMsg = document.getElementById("adStatusMsg");
      const adsManageItems = document.getElementById("adsManageItems");

      let ads = [];
      let defaultSec = 5;
      let currentAdIdx = 0;
      let adTimer = null;
      let pressTimer = null;

      function clampSec(val, fallback) {
        const n = Number(val);
        if (!Number.isFinite(n) || n < 1) return fallback;
        return Math.min(120, Math.round(n));
      }

      function openAdModal() {
        ghTokenInput.value = localStorage.getItem(TOKEN_STORAGE_KEY) || "";
        globalDurInput.value = defaultSec;
        adStatusMsg.textContent = "";
        renderManageList();
        adModalEl.style.display = "block";
      }

      closeAdModalBtn.addEventListener("click", () => {
        adModalEl.style.display = "none";
      });

      minusDurBtn.addEventListener("click", () => {
        globalDurInput.value = clampSec(Number(globalDurInput.value) - 1, 1);
      });

      plusDurBtn.addEventListener("click", () => {
        globalDurInput.value = clampSec(Number(globalDurInput.value) + 1, 5);
      });

      function isTriggerTarget(target) {
        if (!target) return false;
        if (target.closest && target.closest(".sehati-ads-trigger")) return true;
        const txt = (target.textContent || "").trim();
        return txt === "SEHATI ADS";
      }

      document.addEventListener("pointerdown", (e) => {
        if (isTriggerTarget(e.target)) {
          clearTimeout(pressTimer);
          pressTimer = setTimeout(openAdModal, 600);
        }
      }, true);

      document.addEventListener("pointerup", () => clearTimeout(pressTimer), true);
      document.addEventListener("pointercancel", () => clearTimeout(pressTimer), true);
      document.addEventListener("touchstart", (e) => {
        if (isTriggerTarget(e.target)) {
          clearTimeout(pressTimer);
          pressTimer = setTimeout(openAdModal, 600);
        }
      }, { capture: true, passive: true });
      document.addEventListener("touchend", () => clearTimeout(pressTimer), true);
      document.addEventListener("touchcancel", () => clearTimeout(pressTimer), true);

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(String(r.result || "").split(",")[1] || "");
          r.onerror = reject;
          r.readAsDataURL(file);
        });
      }

      function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = "";
        bytes.forEach((b) => { bin += String.fromCharCode(b); });
        return btoa(bin);
      }

      async function getSha(path, token) {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) return null;
        const data = await res.json();
        return data.sha || null;
      }

      async function putFile(path, b64, message, token) {
        const sha = await getSha(path, token);
        const body = { message, content: b64, branch: BRANCH };
        if (sha) body.sha = sha;
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
          method: "PUT",
          headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || "فشل الحفظ في GitHub");
        }
        return res.json();
      }

      async function saveAdsState(nextAds, nextDefaultSec, token) {
        const dSec = clampSec(nextDefaultSec, 5);
        const payload = {
          active: nextAds.length > 0,
          defaultDurationSec: dSec,
          ads: nextAds
        };
        await putFile(
          AD_JSON_PATH,
          utf8ToBase64(JSON.stringify(payload, null, 2)),
          "Update SEHATI ads",
          token
        );
        ads = nextAds;
        defaultSec = dSec;
        currentAdIdx = 0;
        renderCurrentAd();
        scheduleNextAd();
        renderManageList();
      }

      function scheduleNextAd() {
        if (adTimer) clearTimeout(adTimer);
        if (!ads.length) return;
        const ad = ads[currentAdIdx] || ads[0];
        const sec = clampSec(ad && ad.durationSec, defaultSec);
        adTimer = setTimeout(() => {
          currentAdIdx = ads.length > 1 ? (currentAdIdx + 1) % ads.length : 0;
          renderCurrentAd();
          scheduleNextAd();
        }, sec * 1000);
      }

      function renderCurrentAd() {
        if (!ads.length) {
          adBoxEl.innerHTML = "";
          return;
        }
        if (currentAdIdx >= ads.length) currentAdIdx = 0;
        const ad = ads[currentAdIdx];
        const sec = clampSec(ad && ad.durationSec, defaultSec);
        const imgSrc = ad.image ? `${ad.image}?v=${Date.now()}` : "";

        adBoxEl.innerHTML = `
          <div class="ad-card">
            <div class="ad-top-bar">
              <span class="ad-badge">إعلان (${currentAdIdx + 1}/${ads.length}) • ${sec}ث</span>
              <span class="sehati-ads-trigger">SEHATI ADS</span>
            </div>
            ${imgSrc ? `
              <div class="ad-img-wrap">
                <img class="ad-img" src="${imgSrc}" alt="${ad.title || ""}">
              </div>
            ` : ""}
            <div class="ad-body">
              <div style="flex: 1; min-width: 180px;">
                <div class="ad-title">${ad.title || ""}</div>
                <div class="ad-desc">${ad.description || ""}</div>
              </div>
              ${ad.buttonText ? `
                <a class="ad-cta" href="${ad.buttonLink || "#"}">${ad.buttonText}</a>
              ` : ""}
            </div>
          </div>
        `;
      }

      function renderManageList() {
        if (!ads.length) {
          adsManageItems.innerHTML = '<div style="font-size:12px;color:#90a4ae;">لا توجد إعلانات منشورة حالياً.</div>';
          return;
        }
        adsManageItems.innerHTML = ads.map((item, i) => {
          const sec = clampSec(item && item.durationSec, defaultSec);
          return `
            <div class="manage-item">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">#${i + 1} ${item.title || "إعلان"} (${sec}ث)</span>
              <button class="del-btn" data-del="${i}" type="button">حذف</button>
            </div>
          `;
        }).join("");

        adsManageItems.querySelectorAll(".del-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const token = (ghTokenInput.value || localStorage.getItem(TOKEN_STORAGE_KEY) || "").trim();
            if (!token) {
              adStatusMsg.textContent = "أدخل رمز GitHub Token أولاً.";
              return;
            }
            const delIdx = Number(btn.getAttribute("data-del"));
            const updated = ads.filter((_, idx) => idx !== delIdx);
            btn.disabled = true;
            adStatusMsg.textContent = "جاري حذف الإعلان...";
            try {
              await saveAdsState(updated, defaultSec, token);
              adStatusMsg.textContent = "تم حذف الإعلان بنجاح.";
            } catch (err) {
              adStatusMsg.textContent = "خطأ: " + err.message;
            } finally {
              btn.disabled = false;
            }
          });
        });
      }

      saveDurBtn.addEventListener("click", async () => {
        const token = (ghTokenInput.value || localStorage.getItem(TOKEN_STORAGE_KEY) || "").trim();
        if (!token) {
          adStatusMsg.textContent = "أدخل رمز GitHub Token أولاً.";
          return;
        }
        localStorage.setItem(TOKEN_STORAGE_KEY, token);
        const nextDur = clampSec(globalDurInput.value, 5);
        globalDurInput.value = nextDur;
        saveDurBtn.disabled = true;
        adStatusMsg.textContent = "جاري حفظ المدة...";
        try {
          await saveAdsState(ads, nextDur, token);
          adStatusMsg.textContent = `تم حفظ المدة (${nextDur} ثوانٍ).`;
        } catch (err) {
          adStatusMsg.textContent = "خطأ: " + err.message;
        } finally {
          saveDurBtn.disabled = false;
        }
      });

      addAdBtn.addEventListener("click", async () => {
        const token = (ghTokenInput.value || "").trim();
        if (!token) {
          adStatusMsg.textContent = "أدخل رمز GitHub Token أولاً.";
          return;
        }
        localStorage.setItem(TOKEN_STORAGE_KEY, token);
        addAdBtn.disabled = true;
        adStatusMsg.textContent = "جاري رفع الصورة ونشر الإعلان...";

        try {
          let imagePath = "";
          const file = adFileInput.files && adFileInput.files[0];
          if (file) {
            const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
            imagePath = `ad-${Date.now()}.${ext}`;
            const b64 = await fileToBase64(file);
            await putFile(imagePath, b64, `Upload ${imagePath}`, token);
          }

          const customSecRaw = (adItemDurInput.value || "").trim();
          const newAd = {
            id: "ad_" + Date.now(),
            title: (adTitleInput.value || "").trim(),
            description: (adDescInput.value || "").trim(),
            image: imagePath,
            buttonText: (adBtnTextInput.value || "").trim() || "اتصل الآن",
            buttonLink: (adBtnLinkInput.value || "").trim() || "#",
            durationSec: customSecRaw ? clampSec(customSecRaw, defaultSec) : defaultSec
          };

          await saveAdsState([...ads, newAd], defaultSec, token);
          adTitleInput.value = "";
          adDescInput.value = "";
          adFileInput.value = "";
          adItemDurInput.value = "";
          adStatusMsg.textContent = "تمت إضافة الإعلان ونشره بنجاح.";
        } catch (err) {
          adStatusMsg.textContent = "خطأ: " + err.message;
        } finally {
          addAdBtn.disabled = false;
        }
      });

      async function loadAds() {
        try {
          const res = await fetch(`${AD_JSON_PATH}?v=${Date.now()}`, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            if (data && data.defaultDurationSec) {
              defaultSec = clampSec(data.defaultDurationSec, 5);
            }
            if (Array.isArray(data.ads)) {
              ads = data.ads;
            } else if (data && data.active !== false && (data.title || data.description || data.image)) {
              ads = [{
                id: "ad_legacy",
                title: data.title || "",
                description: data.description || "",
                image: data.image || "",
                buttonText: data.buttonText || "اتصل الآن",
                buttonLink: data.buttonLink || "#",
                durationSec: defaultSec
              }];
            }
          }
        } catch (_) {}
        renderCurrentAd();
        scheduleNextAd();
      }

      renderPlaces();
      loadAds();
    })();
  </script>
</body>
</html>
