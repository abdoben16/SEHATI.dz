html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55}
.hero{position:relative;overflow:hidden;color:#fff;padding:18px 18px 70px;background:linear-gradient(150deg,#053f38 0%,#0a7a69 55%,#27b59b 100%);border-radius:0 0 34px 34px}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.top{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 8px}
.brand{display:flex;align-items:center;gap:12px;flex:1 0 100%}
.logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(6px)}
.brand b{font-size:1.5rem;font-weight:800;display:block;line-height:1.1}
.brand small{display:block;opacity:.9;font-size:.84rem;white-space:nowrap;margin-top:2px}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%}.tools .ico{margin-inline-start:auto}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;font:inherit;font-size:.78rem;padding:5px 9px;border-radius:9px;font-weight:700}
.seg button{display:grid;place-items:center}.seg button svg{display:block}.ecg{stroke-dasharray:180 820;animation:dr 3.600s linear infinite}@keyframes dr{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.ecg{animation:none}}.seg button.on{background:#fff;color:#074f46}
.ico{width:36px;height:36px;border:0;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.stats{position:relative;display:flex;gap:8px;margin-top:20px}
.stats div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 6px;text-align:center;backdrop-filter:blur(6px)}
.stats b{display:block;font-size:1.25rem;font-weight:800}
.stats span{font-size:.68rem;opacity:.9}
main{padding:0 14px 120px;max-width:720px;margin:-48px auto 0;position:relative}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:6px 14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.search input{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;padding:10px 0;outline:0;min-width:0}
.search select{border:0;background:var(--soft);color:var(--pr);font:inherit;font-size:.82rem;font-weight:700;border-radius:10px;padding:6px 8px;max-width:38%}
.sos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.sos a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;text-decoration:none;color:#fff;font-weight:800;font-size:.8rem;box-shadow:var(--sh)}
.sos a b{font-size:1.4rem;line-height:1}
.sos a:nth-child(1){background:linear-gradient(135deg,#ff6b5e,#e6483b)}
.sos a:nth-child(2){background:linear-gradient(135deg,#f5a524,#e07b00)}
.sos a:nth-child(3){background:linear-gradient(135deg,#3b82c4,#2563a8)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:.82rem;padding:6px 13px;border-radius:20px}
.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:700}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:11px;box-shadow:var(--sh)}
.ci{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff}
.cb{flex:1;min-width:0}
.cb h3{margin:0;font-size:1rem;font-weight:800;line-height:1.35}
.tag{display:inline-block;background:var(--soft);color:var(--pr);font-size:.74rem;font-weight:700;border-radius:8px;padding:1px 8px;margin:4px 0}
.mu{color:var(--mu);font-size:.85rem}
.acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.acts a,.acts button{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:11px;border:0;background:var(--soft);color:var(--pr);font:inherit;font-size:.82rem;font-weight:700;text-decoration:none}
.acts .go{background:var(--pr);color:#fff}
.acts .del{background:transparent;color:var(--ac)}
.fav{flex:none;align-self:flex-start;border:0;background:transparent;color:var(--mu);padding:2px}
.fav.on{color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:34px 14px}
.empty svg{opacity:.5}
.note{text-align:center;color:var(--mu);font-size:.78rem;padding:6px 10px}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;scrollbar-width:none;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -4px 18px rgba(0,0,0,.07)}
nav button{flex:1 0 62px;border:0;background:transparent;color:var(--mu);font:inherit;font-size:.66rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button.on{color:var(--pr)}
nav button.on i{background:var(--soft)}
nav i{width:40px;height:28px;border-radius:14px;display:grid;place-items:center;font-style:normal}
.fab{position:fixed;inset-inline-end:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:6;background:linear-gradient(135deg,#ff7a6c,#e6483b);color:#fff;border:0;border-radius:30px;padding:13px 20px;font:inherit;font-weight:800;box-shadow:0 6px 18px rgba(230,72,59,.45);display:flex;gap:6px;align-items:center}
dialog{border:1px solid var(--bd);border-radius:22px;background:var(--card);color:var(--tx);width:92%;max-width:430px;padding:18px;font-family:inherit}
dialog::backdrop{background:rgba(5,30,26,.55)}
dialog label{display:block;margin:10px 0 4px;font-size:.84rem;color:var(--mu);font-weight:700}
dialog input,dialog select,dialog textarea{width:100%;padding:11px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;font:inherit}
dialog .acts{margin-top:16px}
dialog .acts button{flex:1;justify-content:center;padding:11px}
.grp{margin:16px 2px 8px;font-weight:800;color:var(--pr);font-size:.92rem;display:flex;justify-content:space-between}.grp span{background:var(--soft);border-radius:10px;padding:0 9px;font-size:.78rem}dialog textarea{min-height:130px;direction:ltr;font-size:.82rem}.ph{direction:ltr;unicode-bidi:plaintext;font-weight:700;color:var(--tx)}</style>
