<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>صحتي - SEHATI.dz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#0f766e;--primary-light:#14b8a6;--danger:#dc2626;--accent:#f59e0b;--blue:#0284c7;--border:#e2e8f0;--shadow:0 6px 18px rgba(15,23,42,.06)}
    body.dark{--bg:#0b1120;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--primary:#14b8a6;--primary-light:#2dd4bf;--danger:#ef4444;--accent:#fbbf24;--blue:#38bdf8;--border:#334155;--shadow:0 6px 18px rgba(0,0,0,.35)}
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:var(--text);line-height:1.55;padding-bottom:110px;transition:background .3s,color .3s}
    .hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f766e 0%,#0d9488 55%,#0284c7 100%);color:#fff;padding:18px 16px 24px;border-radius:0 0 28px 28px;box-shadow:var(--shadow)}
    .top{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
    .logo{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(6px)}
    .logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .ecg{stroke-dasharray:180;stroke-dashoffset:1000;animation:draw 3.8s linear infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    .brand b{font-size:1.35rem;font-weight:800;display:block;line-height:1.1}
    .brand small{display:block;opacity:.9;font-size:.78rem;margin-top:2px}
    .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .seg{display:flex;background:rgba(255,255,255,.18);border-radius:11px;padding:3px}
    .seg button{border:0;background:transparent;color:#fff;font-weight:700;font-size:.78rem;padding:4px 8px;border-radius:8px;cursor:pointer}
    .seg button.on{background:#fff;color:#0f766e}
    .tool-btn{border:0;background:rgba(255,255,255,.22);color:#fff;padding:6px 10px;border-radius:11px;font-weight:700;font-size:.8rem;cursor:pointer}
    .portal-btn{background:#fff;color:#0f766e;font-weight:800}
    .search-wrap input{width:100%;padding:11px 14px;border-radius:14px;border:none;outline:none;font-size:.95rem;background:#fff;color:#0f172a}
    .emergency-sec{padding:14px 16px 6px}
    .sec-head{font-size:.9rem;font-weight:700;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
    .emerg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .emerg-card{background:var(--danger);color:#fff;text-decoration:none;padding:8px 4px;border-radius:12px;text-align:center;font-size:.76rem;font-weight:700;box-shadow:0 3px 8px rgba(220,38,38,.25)}
    .emerg-card b{display:block;font-size:1.02rem;margin-top:2px}
    .ads-showcase{margin:12px 16px 16px;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(245,158,11,.16),rgba(2,132,199,.14));border:1.5px solid var(--accent);box-shadow:var(--shadow);position:relative}
    .ads-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .promo-tag{background:var(--accent);color:#000;font-size:.75rem;font-weight:800;padding:3px 9px;border-radius:7px}
    .ads-body{font-size:.95rem;font-weight:800;margin-bottom:10px;line-height:1.5}
    .ads-cta{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:800;font-size:.86rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
    .bottom-cats-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;padding:10px 12px;z-index:140;box-shadow:0 -4px 16px rgba(0,0,0,.08);scrollbar-width:none}
    .bottom-cats-bar::-webkit-scrollbar{display:none}
    .cat-pill{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:7px 13px;border-radius:18px;white-space:nowrap;font-size:.84rem;font-weight:700;cursor:pointer}
    .cat-pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
    .item-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:relative}
    .item-card.featured{border:2px solid var(--accent)}
    .badge-feat{position:absolute;top:12px;left:12px;background:var(--accent);color:#000;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:8px}
    html[dir="ltr"] .badge-feat{left:auto;right:12px}
    .item-title{font-size:1.08rem;font-weight:800;margin-bottom:2px}
    .item-sub{font-size:.86rem;font-weight:700;color:var(--primary);margin-bottom:6px}
    .item-services{font-size:.82rem;background:var(--bg);padding:6px 10px;border-radius:8px;margin-bottom:8px;color:var(--text)}
    .item-meta{font-size:.85rem;color:var(--muted);margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
    .dot-open{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-inline-end:6px}
    .actions{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px}
    .act-btn{text-decoration:none;border:none;border-radius:10px;padding:8px 6px;font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
    .act-book{background:var(--blue);color:#fff}
    .act-call{background:var(--primary);color:#fff}
    .act-map{background:transparent;color:var(--primary);border:1px solid var(--primary)}
    .act-fav{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px 10px}
    .act-fav.saved{color:#ef4444;border-color:#ef4444}
    .support-fab{position:fixed;bottom:64px;left:16px;background:linear-gradient(135deg,#0f766e,#0284c7);color:#fff;border:none;border-radius:50px;padding:10px 15px;font-size:.85rem;font-weight:800;display:flex;align-items:center;gap:6px;box-shadow:0 6px 20px rgba(15,118,110,.45);cursor:pointer;z-index:150}
    html[dir="ltr"] .support-fab{left:auto;right:16px}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
    .modal.open{display:flex}
    .modal-card{background:var(--card);color:var(--text);width:100%;max-width:450px;border-radius:20px;padding:18px;box-shadow:var(--shadow);max-height:90vh;overflow-y:auto}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px}
    .close-x{background:none;border:none;font-size:1.3rem;color:var(--muted);cursor:pointer}
    .form-group{margin-bottom:10px}
    .form-group label{display:block;font-size:.82rem;font-weight:700;margin-bottom:3px;color:var(--muted)}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.92rem}
    .btn-primary{width:100%;padding:11px;border-radius:11px;border:none;background:var(--primary);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer;margin-top:6px}
    .btn-danger{width:100%;padding:10px;border-radius:11px;border:none;background:var(--danger);color:#fff;font-weight:700;font-size:.88rem;cursor:pointer;margin-top:8px}
    .btn-secondary{width:100%;padding:10px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font-weight:700;font-size:.9rem;cursor:pointer;margin-top:8px}
    .tabs-bar{display:flex;gap:4px;margin-bottom:14px;background:var(--bg);padding:4px;border-radius:12px}
    .tab-btn{flex:1;padding:8px 4px;border:none;border-radius:9px;background:transparent;color:var(--text);font-weight:700;font-size:.82rem;cursor:pointer}
    .tab-btn.active{background:var(--primary);color:#fff}
    .appt-item{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;font-size:.85rem}
    .appt-item header{display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px}
    .status-badge{padding:2px 8px;border-radius:6px;font-size:.74rem;font-weight:800}
    .status-pending{background:#fef3c7;color:#b45309}
    .status-active{background:#dcfce7;color:#15803d}
    .vip-pitch-box{background:linear-gradient(135deg,rgba(15,118,110,.12),rgba(245,158,11,.14));border:1.5px solid var(--primary);padding:14px;border-radius:14px;font-size:.88rem;margin-bottom:12px;line-height:1.65}
    .vip-pitch-box ul{margin:8px 18px}
    .toast{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 20px;border-radius:30px;font-size:.88rem;font-weight:700;z-index:300;display:none;box-shadow:0 4px 14px rgba(0,0,0,.3);text-align:center;max-width:90%}
  </style>
</head>
<body>

  <header class="hero">
    <div class="top">
      <div class="brand" onclick="handleSecretLogoTap()">
        <div class="logo">
          <svg viewBox="0 0 24 24"><polyline class="ecg" points="2 12 6 12 9 4 13 20 16 12 22 12"></polyline></svg>
        </div>
        <div>
          <b>صحتي | SEHATI</b>
          <small id="tagSub">دليلك الصحي وحجز المواعيد في الجزائر</small>
        </div>
      </div>
      <div class="tools">
        <button class="tool-btn portal-btn" onclick="openProPortal()" id="proPortalBtn">🩺 بوابة المهنيين</button>
        <div class="seg">
          <button id="btnAr" class="on" onclick="setLang('ar')">عربي</button>
          <button id="btnFr" onclick="setLang('fr')">
